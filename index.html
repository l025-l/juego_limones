<!DOCTYPE html>
<html>
<head>
  <title>Caza Limones</title>
  <link rel="stylesheet" href="limones.css">
  <script src="utils.js"></script>
</head>
<body onload="iniciar()">
  <div class="contenedor">
    <header class="encabezado">
      <div class="insignia">🍋</div>
      <div>
        <p class="etiqueta">JUEGO ARCADE</p>
        <h1>Atrapar Limones</h1>
        <p class="subtitulo">Si del cielo te caen limones... ¡atrápalos!</p>
      </div>
    </header>

    <div class="autor">
      <span>CREADO POR</span>
      <strong>CRISTIAN DAHUA</strong>
    </div>

    <section class="zona-juego">
      <div class="barra-superior">
        <div class="estado"><span class="punto"></span><span>PARTIDA ACTIVA</span></div>
        <div class="objetivo">¡ATRAPA LOS LIMONES!</div>
      </div>
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </section>

    <div class="panel">
      <div class="marcador">
        <span class="icono">🏆</span>
        <div><small>PUNTAJE</small><strong id="txtPuntaje">0</strong></div>
      </div>
      <div class="separador"></div>
      <div class="marcador">
        <span class="icono">❤️</span>
        <div><small>VIDAS</small><strong id="txtVidas">3</strong></div>
      </div>
    </div>

    <div class="botones">
      <button class="btn btn-izquierda" onclick="moverIzquierda()"><span>◀</span> Izquierda</button>
      <button class="btn btn-derecha" onclick="moverDerecha()">Derecha <span>▶</span></button>
      <button class="btn btn-reiniciar" onclick="reiniciar();">↻ Reiniciar</button>
    </div>

    <button class="btn-desaparecer" onclick="desaparecerPersonaje()">✦ DESAPARECER PERSONAJE</button>

    <footer>Atrapa los limones y consigue la mayor puntuación posible</footer>
  </div>

  <script src="limones.js"></script>
</body>
</html>
